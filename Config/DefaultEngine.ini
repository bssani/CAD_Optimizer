; CAD_Optimizer — VR/PCVR rendering 최적화 cvar 영구 적용
;
; Plugin Config/ 에 위치 → plugin 활성화된 host project 에 자동 merge.
; Host project 의 Config/DefaultEngine.ini 또는 Project Settings GUI 에서
; 명시적 override 가능 (host 우선).
;
; 측정 baseline (C1YC_2_MCM, Quest 3 via Link, RTX 5000 Ada):
;   - 적용 전:                          GPU 111ms / frame 140ms  =  7 FPS
;   - VolCloud/RT/LumenRefl off:        GPU  65ms / frame  72ms  = 14 FPS
;
; DLSS 검토 → 제외 (2026-06-05):
;   - NVIDIA DLSS plugin (Streamline 기반) 이 UE 5.5 VR stereo path 와
;     호환 안 됨. PIE → VR Preview 진입 시 오른쪽 eye 검정 (left eye only).
;   - DLSS plugin (DLSS / Streamline / StreamlineCore / StreamlineNGXCommon
;     / StreamlineReflex / StreamlineDLSSG / StreamlineDeepDVC) disable 시
;     stereo 정상 복구. → 본 .ini 의 DLSS cvar 제거.
;   - TSR 23ms 그대로 유지. 추가 frame time 절감은 다른 path 로 검토:
;     baked lighting (Lumen off), DLAA via BP node, Foveated Rendering 등.
;
; 박제 reference: docs/measurements/visibility_culling_c1yc_2_mcm.md § 6

[SystemSettings]
; ── Volumetric Cloud (불필요) — GPU 16ms 절감
r.VolumetricCloud=0

; ── Ray Tracing (Lumen Software RT 만 사용) — GPU 2~5ms 절감
r.RayTracing.Enable=0
r.Lumen.HardwareRayTracing=0

; ── Lumen Reflections (Lumen GI 는 유지) — GPU 6ms 절감
; r.Lumen.ScreenProbeGather 는 끄지 마세요 (Lumen GI 사라져 어두워짐).
r.Lumen.Reflections.Allow=0

; ── Screen Percentage 80% — 모든 GPU pass 36% 감소
; VR 화질 손해 작음.
r.ScreenPercentage=80
